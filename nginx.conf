server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # `npm run build` writes .gz (and .br) copies of every text file (scripts/precompress.mjs);
    # gzip_static serves them without compressing per request, and gzip covers anything else.
    # The .br copies need the brotli module (ngx_brotli) or a CDN in front of this container.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml application/wasm image/svg+xml;

    # The app shell is revalidated on every visit, so a new deploy takes effect straight away.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite's build output has content hashes in its names and never changes, so it is cached for a year.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Cesium runtime files, facility media, fonts, and brand art keep fixed names, so they are
    # cached for a week and then revalidated; an updated photo is picked up without a rename.
    location ^~ /cesium/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ^~ /media/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ^~ /brand/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
